[env]
# Work around the stale Docker Desktop credsStore in ~/.docker/config.json
# (docker-credential-desktop is gone; colima is the daemon now).
DOCKER_CONFIG = "{{config_root}}/.docker-config"
DOCKER_HOST = "unix://{{env.HOME}}/.colima/default/docker.sock"

[tools]
erlang = "29.0"
elixir = "1.20.1-otp-29"
docker-cli = "latest"
docker-compose = "latest"
